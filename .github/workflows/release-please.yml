name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
    outputs:
      runners: ${{ steps.route.outputs.runners }}
    steps:
      - id: route
        uses: baselinehq/costgraph-action/route@v0
        with:
          default: blacksmith-4vcpu-ubuntu-2404
          release: true

  release:
    needs: [route]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}').release || 'blacksmith-4vcpu-ubuntu-2404' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [route, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && (needs.release.outputs.release_created == 'true') }}
    runs-on: ${{ fromJSON(needs.route.outputs.runners || '{}').publish || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@baselinehq"
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
